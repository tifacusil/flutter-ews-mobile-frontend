name: ews_frontend
description: Early Warning System — landslide monitoring mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.2.3

  # Networking
  dio: ^5.4.3+1

  # Charts
  fl_chart: ^1.2.0

  # Code generation — model annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

